name: CI/CD TODO API

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/projets-sdv/todo-api
  GITOPS_REPO: projets-sdv/gitops-team-eiffage

jobs:
  test-build-push-update-gitops:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} \
            --password-stdin

      - name: Define image tag
        id: vars
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ steps.vars.outputs.tag }} .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ steps.vars.outputs.tag }}

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update image tag in GitOps repository
        run: |
          cd gitops

          sed -i "s|image: ghcr.io/projets-sdv/todo-api:.*|image: ghcr.io/projets-sdv/todo-api:${{ steps.vars.outputs.tag }}|g" apps/todo-api/base/rollout.yaml

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add apps/todo-api/base/rollout.yaml

          git commit -m "ci: update todo-api image to ${{ steps.vars.outputs.tag }}" || echo "No changes to commit"

          git push
